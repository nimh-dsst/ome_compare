[project]
name = "ome-compare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fsspec>=2025.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "memory-profiler>=0.61.0",
    "ome-zarr>=0.9.0",
    "pandas>=2.3.0",
    "qrcode>=8.2",
    "requests>=2.31.0",
    "s3fs>=2025.5.1",
    "seaborn>=0.13.2",
    "tifffile==2025.5.10",
    "tqdm>=4.67.1",
    "zarr<3.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ome_compare = ["data/*.json"]

[dependency-groups]
dev = [
    "ipython>=9.3.0",
    "ruff>=0.4.4",
    "types-requests>=2.32.4.20250611",
    "types-tqdm>=4.67.0.20250516",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 79
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
